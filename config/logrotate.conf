# ==============================================================================
# Logrotate Configuration - Linux Inventory Manager
# ==============================================================================
# Place at /etc/logrotate.d/linux-inventory-manager

/opt/linux-inventory-manager/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 linuxinventory linuxinventory
    sharedscripts
    postrotate
        systemctl reload linux-inventory-backend >/dev/null 2>&1 || true
    endscript
}

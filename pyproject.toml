[project]
name = "linux-inventory-manager"
version = "1.0.0"
description = "Enterprise Linux Inventory & Compliance Platform"
requires-python = ">=3.12"
license = {text = "Proprietary"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration",
    "security: mark test as security-focused",
]
addopts = "-v --tb=short --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # assert used (OK in tests)
    "S105",  # hardcoded password (false positives)
    "S106",  # hardcoded password (false positives)
]

[tool.ruff.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "backend/database/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
fail_under = 70
